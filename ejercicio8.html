<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 8 - Número Mayor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background: linear-gradient(135deg,#0a0f1b, #041e2f, #003344 );
    }
</style>
<div class="container mt-4">
<div class="card shadow-lg">
<div class="card-header text-center bg-primary text-white">
<h3>Ejercicio 8 - Determinar el Número Mayor</h3>
</div>


<div class="card-body">
<h5 class="text-center mb-3">Ingrese Tres Números Enteros</h5>


<div class="mb-3">
<label class="form-label">Número 1:</label>
<input type="number" id="numero1" class="form-control" placeholder="Ejemplo: 4">
</div>


<div class="mb-3">
<label class="form-label">Número 2:</label>
<input type="number" id="numero2" class="form-control" placeholder="Ejemplo: 8">
</div>


<div class="mb-3">
<label class="form-label">Número 3:</label>
<input type="number" id="numero3" class="form-control" placeholder="Ejemplo: 3">
</div>


<button class="btn btn-primary w-100" onclick="calcularMayor()">Calcular Mayor</button>


<div class="alert alert-info text-dark mt-4" id="resultado">
El número mayor es: ...
</div>
</div>
</div>
</div>

<script src="/js/ejercicio8.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
</html>
