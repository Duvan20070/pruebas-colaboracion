    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Paquetería TCC</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg,#0a0f1b, #041e2f, #003344 );
        }
        .table th {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow-lg">
                    <div class="card-header text-center bg-primary text-white">
                        <h4>Ejercicio 4 - TCC</h4>
                    </div>

                    <div class="card-body">

                        <h5 class="text-center mb-3">Tabla de Costos por Zona</h5>
                        <table class="table table-bordered">
                            <tr>
                                <th>Zona</th>
                                <th>Ubicación</th>
                                <th>Costo/Gramo</th>
                            </tr>
                            <tr><td>1</td><td>América del Norte</td><td>$210</td></tr>
                            <tr><td>2</td><td>América Central</td><td>$180</td></tr>
                            <tr><td>3</td><td>América del Sur</td><td>$220</td></tr>
                            <tr><td>4</td><td>Europa</td><td>$340</td></tr>
                            <tr><td>5</td><td>Asia</td><td>$370</td></tr>
                        </table>

                        <label class="form-label">Peso del paquete (Kg):</label>
                        <input type="text" id="peso" class="form-control" placeholder="Ejemplo: 34">

                        <label class="form-label mt-3">Zona de envío:</label>
                        <input type="text" id="zona" class="form-control" placeholder="Ejemplo: 1">

                        <button class="btn btn-success w-100 mt-3" onclick="calcularEnvio()">
                            Calcular Envío
                        </button>

                        <div id="resultado" class="alert alert-info mt-4"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
<script src="/js/ejercicio4.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
</html>
