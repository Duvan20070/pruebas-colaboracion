<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación de Temperatura</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<style>
    body {
        background: linear-gradient(135deg,#0a0f1b, #041e2f, #003344 );
    }
</style>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4>Ejercicio 12 - Diagnóstico de Temperatura</h4>
            </div>

            <div class="card-body">
                <label for="tempInput" class="form-label">Ingrese la temperatura (°C):</label>
                <input type="number" id="tempInput" class="form-control" placeholder="Ejemplo: 25">

                <button class="btn btn-success mt-3" onclick="clasificarTemperatura()">
                    Procesar
                </button>

                <div class="alert alert-info mt-4 d-none" id="resultado"></div>
            </div>
        </div>
    </div>


</body>
</html>

<script src="/js/ejercicio12.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
</html>
