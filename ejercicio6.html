<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 - Audífonos</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container mt-4">
    <div class="card shadow">
      <div class="card-header text-center bg-primary text-white">
        <h3>Ejercicio 6 - Audífonos In Ear</h3>
      </div>

      <div class="card-body">
        <h5 class="text-center mb-3">Cálculo de Pago por Cantidad</h5>

        
        <div class="table-responsive mb-4">
          <table class="table table-bordered text-center">
            <thead class="table-primary">
              <tr>
                <th>Cantidad</th>
                <th>Precio por Unidad</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1000 o más</td>
                <td>$49.850</td>
              </tr>
              <tr>
                <td>Menos de 1000</td>
                <td>$71.290</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad de Audífonos:</label>
          <input id="cantidad" type="number" class="form-control" placeholder="Ejemplo: 350">
        </div>

        <button class="btn btn-primary w-100" onclick="calcularTotal()">Calcular Total</button>

        <div class="alert alert-info mt-3" id="resultado">Total a pagar: $0</div>
      </div>
    </div>
  </div>

</body>
<script src="/js/ejercicio6.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
</html>
